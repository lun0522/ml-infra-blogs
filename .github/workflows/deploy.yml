name: Daily Blog Monitor & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Refresh once daily at 14:00 UTC (6:00 AM PST / 7:00 AM PDT)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest tests -v

      - name: Fetch blog updates and export static data
        working-directory: backend
        run: >-
          python -m app.scripts.update
          --config ../sources.yaml
          --archive ../data/posts.json
          --export-dir ../frontend/public/data

      - name: Commit updated archive to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily blog archive update [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build
        working-directory: frontend
        env:
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
        run: npm ci && npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
