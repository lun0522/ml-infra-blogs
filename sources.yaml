# Curated list of AI & LLM Infrastructure blogs monitored daily.
# Supported modes:
#   rss        - Standard RSS/Atom/Substack XML feed
#   sitemap    - XML sitemap (<urlset> or <sitemapindex>) + article metadata enrichment
#   html_links - Static/SSR index page link extraction + article metadata enrichment

sources:
  - id: vllm
    name: vLLM Blog
    homepage: https://vllm.ai/blog
    mode: rss
    feed_url: https://vllm.ai/blog/rss.xml
    max_items: 50

  - id: lmsys
    name: LMSYS / SGLang
    homepage: https://www.lmsys.org/blog/
    mode: sitemap
    sitemap_url: https://www.lmsys.org/sitemap.xml
    url_pattern: ^https://www\.lmsys\.org/blog/\d{4}-\d{2}-\d{2}-
    max_items: 50

  - id: modal
    name: Modal Blog
    homepage: https://modal.com/blog
    mode: rss
    feed_url: https://modal.com/blog/atom.xml
    max_items: 50

  - id: baseten
    name: Baseten Blog
    homepage: https://www.baseten.co/blog/
    mode: html_links
    index_url: https://www.baseten.co/blog/
    url_pattern: ^https://www\.baseten\.co/blog/[^/?#]+/?$
    exclude_pattern: ^https://www\.baseten\.co/blog/?$
    max_items: 50

  - id: fireworks
    name: Fireworks AI
    homepage: https://fireworks.ai/blog
    mode: html_links
    index_url: https://fireworks.ai/blog
    url_pattern: ^https://fireworks\.ai/blog/[^/?#]+/?$
    exclude_pattern: ^https://fireworks\.ai/blog/?$
    max_items: 50

  - id: together
    name: Together AI
    homepage: https://www.together.ai/blog
    mode: rss
    feed_url: https://www.together.ai/blog/rss.xml
    max_items: 50

  - id: anyscale
    name: Anyscale / Ray
    homepage: https://www.anyscale.com/blog
    mode: sitemap
    sitemap_url: https://www.anyscale.com/sitemap.xml
    url_pattern: ^https://(?:www\.)?anyscale\.com/blog/[^/?#]+/?$
    max_items: 50

  - id: skypilot
    name: SkyPilot Blog
